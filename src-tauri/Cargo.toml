[package]
name = "simple-proxy"
version = "2.0.0"
description = "simple-proxy Tauri 桌面应用"
authors = ["simple-proxy"]
edition = "2021"

[lib]
# Tauri 2 约定：库名与产物名分离，移动端入口依赖 lib
name = "simple_proxy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tray-icon：系统托盘常驻；image-png：托盘图标按 PNG 解码
tauri = { version = "2", features = ["tray-icon", "image-png"] }
# 单实例：防止应用多开导致端口冲突，第二个实例启动时激活已有窗口并退出
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util"] }
axum = "0.8"
reqwest = { version = "0.12", features = ["stream"] }
futures-util = "0.3"
# chrono：访问日志需要本地时间格式化（clock 提供 Local::now）
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
